# ============================================================
# VPRP — Production Overrides
# Nginx reverse proxy, no direct port exposure, resource limits
# ============================================================

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - VPRP_ENV=production
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  nginx:
    image: nginx:alpine
    container_name: vprp-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/htpasswd:/etc/nginx/.htpasswd:ro
      - ~/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
    networks:
      - vprp-net

volumes:
  nginx_logs:
    driver: local
